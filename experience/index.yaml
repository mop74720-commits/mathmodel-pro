  - id: AW-C023
    title: NIPT时点优化与异常判定
    source_kind: award_case
    problem_families: [statistics, optimization, decision]
    data_modality: [tabular, grouped_repeated_measure]
    structure_tags: [mixed_effects, grouping, risk_minimization, multiple_testing]
    methods: [线性混合效应模型, 动态规划分组, 风险最小化, Z检验, FDR校正]
    reusable_patterns: [respect_group_structure, estimation_then_decision]
    validation_patterns: [multiple_testing_control, group_stability]
    transfer_conditions: "存在个体/组层级相关性，并需将统计估计转成决策时点或策略。"
    non_transfer_conditions: "独立同分布假设成立时不应为复杂而强行使用混合效应模型。"
    source_repo: ll2010650-coder/mathmodel-pro
