    source_repo: ll2010650-coder/mathmodel-pro
    source_path: references/training-papers-lessons.md

  - id: TR-T03
    title: 足球争冠概率训练
    source_kind: training_case_with_review
    problem_families: [statistics, stochastic_simulation, dynamic_programming]
    data_modality: [tabular]
    structure_tags: [distribution_test, pairwise_probability, tournament, monte_carlo]
    methods: [正态性检验, 经验分布, 蒙特卡洛, 递推动态规划, 路径枚举]
    reusable_patterns: [independent_method_crosscheck, probability_normalization_invariant]
    failure_patterns: [enumeration_mislabeled_as_monte_carlo, abstract_method_drift, probability_mass_loss]
    validation_patterns: [probability_sum_to_one, multi_method_crosscheck]
    transfer_conditions: "概率传播存在明确赛制/状态图，并可由不同计算路线互验。"
    non_transfer_conditions: "确定性全枚举不能称为蒙特卡洛；归一化不能掩盖遗漏状态。"
    source_repo: ll2010650-coder/mathmodel-pro
    source_path: references/training-papers-lessons.md

