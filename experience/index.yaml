    transfer_conditions: "网络边/节点状态随时间变化，路径可行性依赖传播过程。"
    non_transfer_conditions: "静态最短路不能直接替代时变网络路径。"
    source_repo: ll2010650-coder/mathmodel-pro
    source_path: references/award-winning-papers.md

  - id: AW-E030
    title: AI辅助体测姿态识别
    source_kind: award_case
