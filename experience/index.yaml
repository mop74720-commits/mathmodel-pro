    non_transfer_conditions: "滤波参数必须由信号尺度或验证决定，不能沿用历史窗口。"
    source_repo: ll2010650-coder/mathmodel-pro
    source_path: references/award-winning-papers.md

  - id: TR-T01
    title: 月球日心轨迹仿真训练
    source_kind: training_case_with_review
    problem_families: [mechanistic, kinematics, simulation]
    data_modality: [parameters]
    structure_tags: [progressive_scenarios, coordinate_transform, kepler_equation, numerical_validation]
    methods: [位置矢量叠加, 空间旋转矩阵, 开普勒方程, 牛顿迭代]
    reusable_patterns: [progressive_modeling, degenerate_case_validation, quantitative_residual]
    failure_patterns: [wrong_error_magnitude, model_code_drift, sensitivity_definition_mismatch, symbol_collision]
    validation_patterns: [degenerate_case, residual, convergence]
    transfer_conditions: "多个情景是在同一核心模型上逐层增加自由度。"
    non_transfer_conditions: "演示参数不能伪装成真实物理参数；运动学边界必须显式声明。"
    source_repo: ll2010650-coder/mathmodel-pro
    source_path: references/training-papers-lessons.md

  - id: TR-T02
    title: 钻井布局几何优化训练
    source_kind: training_case_with_review
    problem_families: [geometry, discrete_optimization]
    data_modality: [point_coordinates]
    structure_tags: [periodicity, symmetry, rotation, coarse_to_fine_search]
    methods: [mod1周期化, 环形距离, 反向旋转, 粗细两阶段枚举]
