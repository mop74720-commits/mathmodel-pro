schema: mathmodel-pro-experience/v1
updated: 2026-09-10
policy:
  role: historical_prior_only
  rule: "Historical cases may rank candidates, suggest probes, expose failure modes, and suggest validation; they are prior, not current-problem evidence."
  current_evidence_required: true
matching_dimensions:
  - deliverable
  - problem_family
  - data_modality
  - variable_structure
  - constraint_structure
  - dynamics
  - uncertainty
  - validation_opportunity
  - engineering_risk
retrieval:
  default_top_k: 3
  max_top_k: 5
  prefer_structure_over_topic_name: true
  record:
    - case_id
    - matched_structure
    - mismatch
    - transfer_risk
    - candidate_effect
    - deciding_probe

cases:
  - id: AW-A016
    title: 板凳龙位置与速度分析
    source_kind: award_case
    problem_families: [mechanistic, geometry, kinematics]
    data_modality: [parameters]
    structure_tags: [spiral_geometry, recursive_kinematics, collision_detection, matrix_batching]
    methods: [等距螺线, 极坐标弧长积分, 变步长逼近, 碰撞检测, 矩阵化递推]
    reusable_patterns: [progressive_modeling, geometry_before_search, claim_result_link]
    validation_patterns: [degenerate_case, geometric_consistency]
    transfer_conditions: "连续几何运动、递推状态、碰撞或边界事件决定答案。"
    non_transfer_conditions: "真实动力学主导而非预设轨迹时，不能把运动学模型当动力学证据。"
    source_repo: ll2010650-coder/mathmodel-pro
    source_path: references/award-winning-papers.md

  - id: AW-A053
    title: 板凳龙形态调节与目标优化
    source_kind: award_case
    problem_families: [mechanistic, geometry, optimization]
    data_modality: [parameters]
    structure_tags: [spiral_geometry, collision_detection, single_objective, constrained_search]
    methods: [阿基米德螺线, 分离轴定理, 变步长遍历, 单目标优化, 粒子群]
    reusable_patterns: [prove_structure_before_search, symmetry_or_geometry_reduction, explicit_optimization_contract]
    validation_patterns: [sensitivity, cross_question_consistency]
    transfer_conditions: "几何可行域可以先解析压缩，再做低维优化。"
    non_transfer_conditions: "不要因为历史案例用了 PSO 就默认当前非线性问题也需要启发式。"
    source_repo: ll2010650-coder/mathmodel-pro
    source_path: references/award-winning-papers.md

  - id: AW-A196
    title: 无人机烟幕遮蔽策略优化
    source_kind: award_case
    problem_families: [optimization, geometry, decision]
    data_modality: [parameters]
    structure_tags: [kinematics, boolean_feasibility, multi_stage_decision, dimensionality_reduction, mixed_integer]
    methods: [遮挡布尔函数, 二分查找, 多起点变步长, 差分进化, 分层优化, 整数规划, 分支定界]
    reusable_patterns: [prove_before_compute, dimensionality_reduction, hierarchical_optimization, assignment_then_parameters]
    validation_patterns: [independent_solver_crosscheck, local_refinement]
    transfer_conditions: "高维策略问题可拆成结构决策与连续参数优化，且几何性质能压缩搜索空间。"
    non_transfer_conditions: "历史最优策略和参数不得迁移；只能迁移分解方式与验证思路。"
    source_repo: ll2010650-coder/mathmodel-pro
    source_path: references/award-winning-papers.md

  - id: AW-B060
    title: 红外干涉外延层厚度反演
    source_kind: award_case
    problem_families: [mechanistic, inverse_problem, estimation]
    data_modality: [signal, spectrum]
    structure_tags: [physics_model, nonlinear_inversion, parameter_estimation, dual_route]
    methods: [Drude折射率, 干涉反射模型, 波谷周期法, 牛顿迭代]
    reusable_patterns: [physics_first, direct_estimate_plus_inversion]
    validation_patterns: [independent_route_crosscheck]
    transfer_conditions: "物理公式可给出直接估计，同时存在数值反演路线。"
    non_transfer_conditions: "模型参数不可辨识或色散模型不适用时，必须先做可辨识性检查。"
    source_repo: ll2010650-coder/mathmodel-pro
    source_path: references/award-winning-papers.md

  - id: AW-B157
    title: 双光束与多光束干涉厚度测量
    source_kind: award_case
    problem_families: [mechanistic, inverse_problem, estimation]
    data_modality: [signal, spectrum]
    structure_tags: [optics, spectral_analysis, nonlinear_fit, model_upgrade]
