    methods: [LMM_REML, 高斯过程回归, 遗传算法, DeepHit, LightGBM, Optuna, stacking]
    reusable_patterns: [baseline_before_ensemble, structured_validation_for_complex_ml]
    validation_patterns: [heldout_comparison, ablation]
    transfer_conditions: "样本与特征足以支持复杂模型，并有严格分组/时间切分和基线。"
    non_transfer_conditions: "小样本或验证薄弱时，不把模型堆叠当创新。"
