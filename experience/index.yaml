    non_transfer_conditions: "整数问题的连续对偶/Reduced Cost解释不可无条件迁移。"
    source_repo: ll2010650-coder/mathmodel-pro
    source_path: references/training-papers-lessons.md

  - id: CL-2001B-VESSEL
